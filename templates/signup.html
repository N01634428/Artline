<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Artline</title>
    <link rel="stylesheet"  href="/static/css/auth.css">
</head>
<body>
    <header>
        <div class="nav-img" style="color: black;">
            <h1>ArtLine</h1>
        </div>
    </header>

    <div class="container">
        <h2>Create an account</h2>
        <form action="/signup" id= "sign-up" method="POST">

            <label for = "username" >UserName: </label> 
            <input type="text" id="username" name="username" placeholder="Enter Your UserName" required>

            <label for ="email">Email:</label>
            <input type="email" id="email" name ="email" placeholder="Enter Your Email Address" required>

            <label for =" password">Password: </label>
            <input type = "password" id="password" name="password" placeholder="Enter Your Password" required>

            <label for = "confirm-password">Confirm Password: </label>
            <input type = "password" id="confirm-password" name="confirm-password" placeholder="Enter Confirm Password" required>

            <button id="button" type="submit">Sign Up</button>


             <div class="links">
            <p>Already have an account?</p>
            <a href="{{url_for('login')}}">Login</a>
             </div>


        </form>
    </div>
    
</body>
</html>
