<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Orders</title>
    <link rel="stylesheet" href="/static/css/orders.css">
</head>
<body>
    <h1>Pending Orders</h1>
    <table>
        <thead>
            <tr>
                
                <th>Business Name</th>
                <th>Customer Name</th>
                <th>Product Name</th>
                <th>Phone Number</th>
                <th>Quantity</th>
                <th>Order Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for order in pending_orders %}
                <tr>
                    
                    <td>{{ order[1] }}</td>
                    <td>{{ order[2] }}</td>
                    <td>{{ order[3] }}</td>
                    <td>{{ order[4] }}</td>
                    <td>{{ order[5] }}</td>
                    <td>{{ order[6] }}</td>
                    <td>
                        <!-- Form to update status -->
                        <form action="{{ url_for('update_order_status', order_id=order[0]) }}" method="POST">
                            <select name="status" required>
                                <option value="pending" {% if order[6] == 'pending' %} selected {% endif %}>Pending</option>
                                <option value="completed" {% if order[6] == 'completed' %} selected {% endif %}>Completed</option>
                            </select>
                            <button type="submit">Update</button>
                        </form>
                    </td>
                </tr>
            {% else %}
                <tr><td colspan="8">No pending orders</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
