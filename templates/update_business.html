<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Business</title>
    <link rel="stylesheet" href="/static/css/update.css">
</head>
<body>
    <h2>Edit Business Details</h2>

    <!-- The update business form -->
    <form action="{{ url_for('update_business', business_id=business[0]) }}" method="POST">
        <div>
            <label for="name">Business Name:</label>
            <input type="text" id="name" name="name" value="{{ business[1] }}" required>
        </div>
        <div>
            <label for="address">Business Address:</label>
            <input type="text" id="address" name="address" value="{{ business[2] }}" required>
        </div>
        <div>
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" value="{{ business[3] }}" required>
        </div>
        <div>
            <label for="personname">Person's Name:</label>
            <input type="text" id="personname" name="personname" value="{{ business[4] }}" required>
        </div>

        <div>
            <button type="submit">Update Business</button>
        </div>
    </form>

     <form action="{{ url_for('delete_business', business_id=business[0]) }}" method="POST" style="display: inline;">
        <button class= "delete-button"  type="submit" onclick="return confirm('Are you sure you want to delete this business?');">Delete</button>
    </form>

    <!-- Link back to businesses page -->
    <a href="{{ url_for('businesses') }}">Back to Businesses</a>
</body>
</html>
