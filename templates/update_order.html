<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Order</title>
    <link rel="stylesheet" href="/static/css/update.css">
</head>
<body>
    <h2>Edit Order Details</h2>

    <!-- The update order form -->
    <form action="{{ url_for('update_order', order_id=order[0]) }}" method="POST">
        <div>
            <label for="business">Business Name:</label>
            <input type="text" id="business" name="business" value="{{ order[2] }}" required>
        </div>
        <div>
            <label for="customer">Customer Name:</label>
            <input type="text" id="customer" name="customer" value="{{ order[4] }}" required>
        </div>
        <div>
            <label for="product">Product Name:</label>
            <input type="text" id="product" name="product" value="{{ order[3] }}" required>
        </div>
        <div>
            <label for="phone_number">Phone Number:</label>
            <input type="text" id="phone_number" name="phone_number" value="{{ order[5] }}" required>
        </div>
        <div>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" value="{{ order[6] }}" required>
        </div>
        <div>
    <label for="status">Order Status:</label>
    <select id="status" name="status" required>
        <option value="pending" {% if order[7] == 'pending' %}selected{% endif %}>Pending</option>
        <option value="completed" {% if order[7] == 'completed' %}selected{% endif %}>Completed</option>
        
    </select><br><br>
</div>

        <div>
            <button type="submit">Update Order</button>
        </div>
    </form>

    <!-- Delete order form -->
    <form action="{{ url_for('delete_order', order_id=order[0]) }}" method="POST" style="display: inline;">
        <button class="delete-button" type="submit" onclick="return confirm('Are you sure you want to delete this order?');">Delete</button>
    </form>

    <!-- Link back to orders page -->
    <a href="{{ url_for('orders') }}">Back to Orders</a>
</body>
</html>
