<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Products</title>
    <link rel="stylesheet" href="/static/css/update.css">
</head>
<body>
    <h2>Edit Products Details</h2>

    
    

    <!-- The update business form -->
    <form action="{{ url_for('update_products', product_id=product[0]) }}" method="POST">
        <div>
            <label for="name">Product Name:</label>
            <input type="text" id="name" name="name" value="{{ product[1] }}" required>
        </div>
        <div>
            <label for="type">Prducts Type:</label>
            <input type="text" id="type" name="type" value="{{ product[2] }}" required>
        </div>
        <div>
            <label for="description">Product Description:</label>
             <textarea id="description" name="description" required>{{ product[3] }}</textarea>
        </div>
        

        <div>
            <button type="submit">Update Product</button>
        </div>
    </form>
    <form action="{{ url_for('delete_product', product_id=product[0]) }}" method="POST" style="display: inline;">
            <button class="delete-button" type="submit" onclick="return confirm('Are you sure you want to delete this product?');">Delete</button>
    </form>

    <!-- Link back to businesses page -->
    <a href="{{ url_for('products') }}">Back to Products</a>
</body>
</html>
